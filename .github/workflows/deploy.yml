# Publica el sitio en GitHub Pages en cada push a main (o a mano desde la pestaña Actions).
# Requisito en el repositorio: Settings → Pages → Source: "GitHub Actions".
#
# Las acciones van fijadas a una versión exacta (como las dependencias de npm): un cambio en una
# acción de terceros no puede alterar el despliegue sin que lo decidamos.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: leer el código y publicar en Pages (id-token: la autenticación OIDC que usa
# deploy-pages para demostrar que el despliegue viene de este repositorio).
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, se encola en lugar de cancelar el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24 # Vite 8 y Vitest 5 necesitan Node >= 22.12
          cache: npm
      - run: npm ci
      # Si algún test falla, no se publica.
      - run: npm test
      - run: npm run build
        env:
          # El sitio vive en /<nombre del repositorio>/ (p. ej. /Su-30/).
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
