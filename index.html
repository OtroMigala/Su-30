<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Portafolio interactivo: vuela en la cabina de un Su-30 de noche." />
    <meta name="theme-color" content="#02060a" />
    <title>Cabina Su-30</title>
    <link rel="icon" href="data:," />
    <!-- B612 / B612 Mono: tipografía diseñada para cabinas de Airbus, licencia OFL -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,body{margin:0;height:100%;background:#02040a}
      .boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;margin:0;
        color:#8dffa0;font:14px 'B612 Mono',ui-monospace,monospace;letter-spacing:.12em;
        text-shadow:0 0 6px rgba(141,255,160,.6)}
    </style>
  </head>
  <body>
    <!-- Pantalla de arranque estática: se ve en cuanto llega el HTML, mientras se descarga el
         JavaScript (~1.3 MB). Al montar, React reemplaza el contenido de #root por la suya. -->
    <div id="root">
      <div class="boot" role="status">INICIANDO SISTEMAS</div>
    </div>
    <noscript><p class="boot">Este portafolio necesita JavaScript y WebGL.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
